name: Playwright Scheduled Test

on:
  schedule:
    - cron: '0 8 * * *'  # Jalankan setiap hari pukul 08:00 UTC
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Test path, for example tests/saucedemo/login.spec.ts. Leave empty to run all tests.'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
      SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
      TEST_PATH: ${{ inputs.test_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests with JSON report
        shell: bash
        run: |
          if [ -n "$TEST_PATH" ]; then
            npx playwright test "$TEST_PATH"
          else
            npx playwright test
          fi

      - name: Upload JSON Report
        if: always()  # Selalu upload, meskipun tes berhasil/gagal
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: playwright-report.json
      - name: Upload HTML Report
        if: always()  # Supaya tetap di-upload meskipun test gagal
        uses: actions/upload-artifact@v4
        with:
            name: playwright-html-report
            path: playwright-report/

      - name: Send report to Slack
        if: always()  # Pastikan Slack tetap dapat notifikasi meskipun tes gagal
        run: node slack-playwright-report.js
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
